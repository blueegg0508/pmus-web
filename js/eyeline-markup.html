<!-- eyeline-markup.html — 아이라인 편집 화면 (베타)
     눈썹 · 입술 편집 화면과 같은 껍데기(mobile-ui.css 의 mui-*)를 그대로 입는다.
     조절 로직은 eyeline-canvas.js 한 곳에 있다. -->
<div class="mui-shell eye-shell">
    <button type="button" class="mui-settings" id="eSettings">사진 · 부위 변경</button>

    <div class="mui-topbar">
        <div class="mui-seg" id="eViewSeg">
            <button type="button" data-view="before">시술 전</button>
            <button type="button" data-view="after" class="is-active">예상 디자인</button>
            <button type="button" data-view="compare">비교</button>
        </div>
        <div class="mui-actions">
            <button type="button" id="eUndo" disabled>되돌리기</button>
            <button type="button" id="eRedo" disabled>다시실행</button>
            <button type="button" id="eReset">조절 초기화</button>
        </div>
    </div>

    <div class="mui-chips" id="eChips">
        <button type="button" class="eye-chip is-active" data-crop="both">👀 두 눈</button>
        <button type="button" class="eye-chip" data-crop="L">👈 왼쪽 눈</button>
        <button type="button" class="eye-chip" data-crop="R">오른쪽 눈 👉</button>
        <button type="button" class="eye-chip" data-crop="upper">얼굴 상부</button>
        <button type="button" class="eye-chip" data-crop="face">얼굴 전체</button>
        <button type="button" class="eye-chip eye-closed-chip" id="eClosedBtn">😌 감은 눈 사진</button>
        <button type="button" class="eye-chip" id="eClosedSwap" hidden>감은 사진 바꾸기</button>
    </div>

    <div class="mui-stage eye-stage" id="eStage">
        <div class="eye-pair is-shown" id="ePair">
            <figure class="eye-fig" id="eFigOpen">
                <canvas id="eyeCanvas"></canvas>
                <figcaption>눈 뜬 모습</figcaption>
            </figure>
            <figure class="eye-fig" id="eFigClosed" hidden>
                <canvas id="eyeCanvasClosed"></canvas>
                <figcaption>눈 감은 모습</figcaption>
            </figure>
        </div>
    </div>
    <div class="mui-hint" id="eHint">아래 조절바로 두께 · 꼬리를 맞추세요</div>

    <div class="mui-sheet" data-snap="half" id="eSheet">
        <div class="mui-handle" id="eHandle"></div>
        <div class="mui-modebar">
            <button type="button" id="eModeQuick">⚡ 퀵</button>
            <button type="button" id="eModeManual">🎚️ 메뉴얼</button>
        </div>
        <div class="mui-sidenote" id="eSideNote" hidden></div>

        <!-- 퀵: 디자인 · 색 · 조절 5개 -->
        <div class="mui-panes mui-quick" id="eQuick">
            <div class="mui-qhead">디자인</div>
            <div class="eye-styles" id="eStyles"></div>
            <div class="mui-qhead">색상</div>
            <div class="mui-qcolors" id="eColors"></div>
            <div class="mui-qhead">조절</div>
            <div id="eQuickRows"></div>
            <div class="mui-histtools eye-tools" data-tools></div>
            <button type="button" class="mui-qswitch" id="eToManual">🎚️ 세부 조정 (메뉴얼)</button>
        </div>

        <!-- 메뉴얼: 왼쪽 · 오른쪽 따로 + 세부 조절 -->
        <div class="mui-panes eye-manual" id="eManual">
            <div class="mui-qhead">조절할 눈</div>
            <div class="eye-sides" id="eSides">
                <button type="button" data-side="both" class="is-active">🔗 두 눈 함께</button>
                <button type="button" data-side="L">👈 사진 왼쪽</button>
                <button type="button" data-side="R">사진 오른쪽 👉</button>
            </div>
            <div class="mui-qhead">모양</div>
            <div id="eManualRows"></div>
            <div class="mui-qhead">색상</div>
            <div class="mui-qcolors" id="eColors2"></div>
            <label class="eye-pick">직접 고르기 <input type="color" id="eColorPick" value="#1c1714"></label>
            <div class="mui-histtools eye-tools" data-tools></div>
        </div>
    </div>
</div>
